model:
  name_or_path: Qwen/Qwen3-VL-8B-Instruct
  thinking_name_or_path: Qwen/Qwen3-VL-8B-Thinking
  temperature: 0.1
  device: cuda
  dtype: bfloat16
  max_new_tokens:
    clue_discovery: 3072
    page_screening: 512
    difficulty_assessment: 512
    core_decision: 512
    core_decision_thinking: 4096

retriever:
  type: colpali
  name_or_path: vidore/colpali-v1.3-hf
  top_k: 5

pipeline:
  mode: mock
  save_intermediates: true
  render_dpi: 144
  region_refinement: fallback
  difficulty_model_switching_enabled: true

evaluation:
  evidence_page_base: auto

paths:
  agent_prompts_md: agent_prompts.md
  sol_instructions_md: sol_instructions.md

sol:
  instruction_md_required: true
